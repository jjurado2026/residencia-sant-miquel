<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Residència Sant Miquel Arcàngel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A2624">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
<link rel="preload" href="assets/fonts/zodiak.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/commissioner.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Zodiak'; src: url('assets/fonts/zodiak.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Commissioner'; src: url('assets/fonts/commissioner.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root {
    --carbo: #2A2624; --rosa: #B48797; --rosa-fosc: #8E5F71; --flor: #E8B9C6; --tinta: #2E2926; --text: #3D3632; --blanc: #FFFCFA;
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --muelle: linear(0, .049, .174, .34, .521, .696, .849, .974, 1.065, 1.124, 1.155, 1.163, 1.153, 1.132, 1.104, 1.075, 1.046, 1.022, 1.002, .988, .979, .974, .973, .975, .979, .984, .988, .993, .997, 1, 1.002, 1.004, 1.004, 1.004, 1.004, 1.003, 1);
    --alto: min(62svh, 560px);
  }
  @supports not (transition-timing-function: linear(0, 1)) { :root { --muelle: cubic-bezier(.34, 1.56, .64, 1); } }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--blanc); color: var(--text);
    font-family: 'Commissioner', 'Segoe UI', system-ui, sans-serif; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid var(--rosa-fosc); outline-offset: 3px; border-radius: 3px; }

  /* La cabecera, en el carbón de su web, con la banda rosa de su pie */
  .cab { position: relative; background: var(--carbo); border-bottom: 4px solid var(--rosa); padding: clamp(14px, 2.6svh, 24px) var(--canal) clamp(16px, 2.8svh, 26px); color: var(--flor); }
  .cab strong { color: #fff; }
  .cab p { font-family: 'Zodiak', Georgia, serif; font-weight: 500; font-size: clamp(.95rem, .85rem + .4vw, 1.2rem); line-height: 1.1; }
  .cab strong { display: block; font-family: 'Zodiak', Georgia, serif; font-weight: 500; font-size: clamp(1.6rem, 1.1rem + 2.2vw, 2.8rem); line-height: 1.05; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(48px, 9svh, 96px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Zodiak', Georgia, serif; font-weight: 500; color: var(--tinta); font-size: clamp(1.75rem, 1.1rem + 2.4vw, 3.1rem); line-height: 1.14; text-wrap: balance; max-width: 19ch; }
  .mas { max-width: 34em; }
  .mas a { color: var(--tinta); font-weight: 700; text-decoration: underline; text-decoration-color: var(--flor); text-decoration-thickness: 3px; text-underline-offset: 6px; overflow-wrap: anywhere; display: inline-block; transition: transform .45s var(--muelle); }
  .mas a:hover { transform: translateY(-2px); }
  .mas a:active { transform: translateY(1px); }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; border-radius: 6px; background: #fff;
    box-shadow: 0 0 0 1px rgba(46, 41, 38, .14), 0 30px 60px -28px rgba(42, 38, 36, .55); position: relative; }
  .ventana::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(180, 135, 151, .75); border-radius: 3px; pointer-events: none; }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(2) { animation-delay: .1s; }
    .ventana { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 56s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <p>Residència d'avis <strong>Sant Miquel Arcàngel</strong></p>
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Resid%C3%A8ncia%20Sant%20Miquel%20Arc%C3%A0ngel">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home completa">
        <img src="assets/img/home-miniatura.webp" width="480" height="4057" alt="Miniatura de la home propuesta para la Residència Sant Miquel Arcàngel, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
